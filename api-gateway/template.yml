AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stag
      - prod
    Description: Deployment environment

  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for jcampos.dev (resolved at deploy time)

Resources:

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/tsuru-${Environment}-cd-backend-api"
      RetentionInDays: 14

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn:
        Fn::ImportValue: !Sub "tsuru-${Environment}-apigateway-cloudwatch-role-arn"

  ApiGatewayRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "tsuru-${Environment}-cd-backend-api"
      StageName: !Ref Environment
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '$context.requestId $context.requestTime $context.httpMethod $context.resourcePath $context.status $context.responseLength $context.error.message'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub "tsuru-${Environment}-cd-backend-api"
          description: Cross-Docking Backend API
          version: '1.0.0'
        servers:
          - url: 'https://orders-api.tsuru.jcampos.dev'
            x-amazon-apigateway-endpoint-configuration:
              disableExecuteApiEndpoint: true
        components:
          securitySchemes:
            CognitoAuthorizer:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs:
                  - Fn::ImportValue: "tsuru-cognito-UserPoolArn"
        paths:
          "/api/organizations/{organization_id}/appointments":
            get:
              operationId: backend_list_appointments_api_organizations__organization_id__appointments_get
              summary: Appointments in a date range
              parameters:
                - name: organization_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: from
                  in: query
                  required: true
                  schema:
                    type: string
                - name: to
                  in: query
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: OK
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                '400':
                  description: Bad Request
                '404':
                  description: Not Found
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cd-backend-${Environment}-lambda/invocations"
                passthroughBehavior: when_no_match
                contentHandling: CONVERT_TO_TEXT
                type: aws_proxy
                requestParameters:
                  integration.request.header.x-user-id: context.authorizer.claims.sub
            post:
              operationId: backend_create_appointment_api_organizations__organization_id__appointments_post
              summary: Book an appointment
              parameters:
                - name: organization_id
                  in: path
                  required: true
                  schema:
                    type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
              responses:
                '200':
                  description: OK
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                '400':
                  description: Bad Request
                '404':
                  description: Not Found
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cd-backend-${Environment}-lambda/invocations"
