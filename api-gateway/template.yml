      RestApiId: !Ref ApiGatewayRestApi

  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: orders-api.tsuru.jcampos.dev
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: orders-api.tsuru.jcampos.dev
          HostedZoneId: !Ref HostedZoneId

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: orders-api.tsuru.jcampos.dev
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          CertificateArn: !Ref ApiCertificate

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref ApiGatewayRestApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref Environment

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: orders-api.tsuru.jcampos.dev
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

  LambdaPermissionBackend:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub "cd-backend-${Environment}-lambda"
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

Outputs:
  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGatewayRestApi
    Export:
      Name: !Sub "${AWS::StackName}-ApiId"

  ApiEndpoint:
    Description: Custom domain endpoint
    Value: https://orders-api.tsuru.jcampos.dev
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  ApiInvokeUrl:
    Description: Direct invoke URL
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiInvokeUrl"