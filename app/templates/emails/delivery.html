<!DOCTYPE html>
<html lang="es">
<head>

  <title>Tsuru — Notificación de entrega</title>

<body style="margin:0;padding:0;background-color:#F4EFE6;font-family:Arial,Helvetica,sans-serif;color:#3D4045;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F4EFE6" style="background-color:#F4EFE6;">
    <tr><td align="center" style="padding:32px 16px;">
      <!--[if mso]><table role="presentation" width="560" align="center"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#FFFFFF" style="width:100%;max-width:560px;background-color:#FFFFFF;border:1px solid #E5DCCF;border-radius:16px;">
        <tr><td align="center" bgcolor="#F4EFE6" style="padding:0;background-color:#F4EFE6;border-radius:16px 16px 0 0;">

        <tr><td align="center" style="padding:32px 24px 16px;text-align:center;">

        </td></tr>
        <tr><td style="padding:0 24px 32px;font-size:16px;line-height:1.6;color:#3D4045;">
          <p style="margin:0 0 16px;color:#6B2A22;font-weight:bold;">Modas Laura</p>
          <p style="margin:0 0 16px;">Buen día,</p>

          <a href="https://tsuru.jcampos.dev" style="font-size:13px;line-height:1.6;color:#6B2A22;text-decoration:underline;">tsuru.jcampos.dev</a>
        </td></tr>
        <tr><td align="center" style="padding:0;font-size:0;line-height:0;border-radius:0 0 16px 16px;">
          <img src="https://tsuru.jcampos.dev/brand/email-footer-waves-compact.png" width="560" height="48" alt="" role="presentation" style="display:block;width:100%;max-width:560px;height:auto;border:0;border-radius:0 0 16px 16px;" />
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
