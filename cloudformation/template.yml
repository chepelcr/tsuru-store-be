AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: SAM Template for Cross-Docking Backend Lambda Function

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stag, prod]

  ECRImageURIParam:
    Description: Elastic Container Registry image URI
    Type: String
    Default: "cd-backend-ecr"

Mappings:
  EnvironmentMapping:
    dev:
      ConfigStage: "DEVELOPMENT"
    stag:
      ConfigStage: "STAGING"
    prod:
      ConfigStage: "PRODUCTION"

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Architectures:
      - arm64
    Environment:
      Variables:
        STAGE: !FindInMap [EnvironmentMapping, !Ref Environment, ConfigStage]
        ENVIRONMENT: !Ref Environment

Resources:
  CrossDockingBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "cd-backend-${Environment}-lambda"
      Description: "Cross-Docking Backend API, branch discovery and order-link consumer"
      PackageType: Image
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRImageURIParam}:latest"
      Role: !GetAtt LambdaRole.Arn
      SnapStart:
        ApplyOn: None
      Events:
        OrganizationBranches:
          Type: SQS
          Properties:
            Queue: !ImportValue
              'Fn::Sub': "tsuru-${Environment}-organization-branches-queue-arn"
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
        # Which electronic document billed an order (TSR-317). Published by
        # sales-be's document-validator on an ACCEPTED Hacienda verdict; both
        # sources funnel into the one handler, which dispatches on `event_type`.
        OrderDocumentLink:
          Type: SQS
          Properties:
            Queue: !ImportValue
              'Fn::Sub': "tsuru-${Environment}-order-document-link-queue-arn"
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cd-backend-${Environment}-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !ImportValue
          'Fn::Sub': "tsuru-${Environment}-app-config-policy-arn"
        - !ImportValue
          'Fn::Sub': "tsuru-${Environment}-ssm-parameter-policy-arn"
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
        - !ImportValue
          'Fn::Sub': "tsuru-${Environment}-ec2-connect-policy-arn"
        - !ImportValue
          'Fn::Sub': "tsuru-${Environment}-decrypt-policy-arn"
        - !ImportValue
          'Fn::Sub': "tsuru-${Environment}-ecr-policy-arn"
        - !ImportValue
          'Fn::Sub': "tsuru-${Environment}-s3-policy-arn"
      Policies:
        - PolicyName: OrganizationBranchesConsumer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !ImportValue
                  'Fn::Sub': "tsuru-${Environment}-organization-branches-queue-arn"
        - PolicyName: OrderDocumentLinkConsumer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !ImportValue
                  'Fn::Sub': "tsuru-${Environment}-order-document-link-queue-arn"

  CrossDockingBackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/cd-backend-${Environment}-lambda"
      RetentionInDays: 30

  CrossDockingBackendLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CrossDockingBackendFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*"

  # Keep-warm ping: container-image Lambdas idle for ~14 days lose their cached
  # image, and the next invoke fails with a 409 CodeArtifactUserPendingException
  # that API Gateway surfaces to callers as a 500. This ping keeps the image
  # cache alive; the handler short-circuits on the constant Input below, so each
  # ping costs one init and runs no application work.
  KeepWarmRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "cd-backend-${Environment}-keepwarm"
      Description: "Periodic ping that keeps the container image cache warm"
      ScheduleExpression: "rate(5 days)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt CrossDockingBackendFunction.Arn
          Id: KeepWarmPing
          Input: '{"warmup": true}'

  # Allow EventBridge to invoke the Lambda
  KeepWarmLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CrossDockingBackendFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt KeepWarmRule.Arn


  ObservabilityPublishPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "tsuru-${Environment}-observability-publish"
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource:
              - !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:tsuru-${Environment}-audit-records-topic"
              - !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:tsuru-${Environment}-backend-errors-topic"

Outputs:
  CrossDockingBackendFunctionArn:
    Description: "Cross-Docking Backend Lambda Function ARN"
    Value: !GetAtt CrossDockingBackendFunction.Arn
    Export:
      Name: !Sub "cd-backend-${Environment}-arn"

  CrossDockingBackendFunctionName:
    Description: "Cross-Docking Backend Lambda Function Name"
    Value: !Ref CrossDockingBackendFunction
    Export:
      Name: !Sub "cd-backend-${Environment}-name"
